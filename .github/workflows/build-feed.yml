name: Build feed

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes
  workflow_dispatch:          # and a manual button, for when you just approved a post

permissions:
  contents: write

concurrency:
  group: build-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build feed.json
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/build-feed.mjs

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain feed/feed.json)" ]]; then
            git config user.name  "traction-bot"
            git config user.email "actions@github.com"
            git add feed/feed.json
            git commit -m "Update board"
            git push
          else
            echo "Nothing to commit."
          fi
